name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Build must not depend on real secrets. A dummy session secret keeps
          # the local driver happy; no external services are contacted at build.
          BESKAR_DRIVER: local
          BESKAR_SESSION_SECRET: ci-build-secret-000000000000000000000000000000000000000000000000
          NEXT_PUBLIC_SITE_URL: https://example.com
